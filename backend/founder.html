<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Problem-Net Founder Control</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0;background:radial-gradient(circle at top,#172238 0,#0b0d12 45%,#07080c 100%);color:#f5f7fb;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#121722;border:1px solid #273044;border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{font-size:26px;font-weight:800}.muted{color:#8d98aa;font-size:13px}.nav{display:flex;gap:8px;overflow:auto;margin:12px 0}.btn{border:0;border-radius:10px;padding:10px 13px;background:#1c2433;color:#fff;font-weight:700}.primary{background:#2d6df6}.danger{background:#8b2634}.ok{color:#58e69a}.warn{color:#ffd166}.bad{color:#ff7485}input,textarea,select{width:100%;box-sizing:border-box;background:#0c1018;color:#fff;border:1px solid #303a50;border-radius:9px;padding:9px;margin:5px 0}.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{padding:8px;border-bottom:1px solid #263044;text-align:left}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}</style></head>
<body><div class="wrap"><h2>👑 Founder Control Center</h2><div id="me" class="muted"></div><div id="app">Загрузка…</div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
function launchToken(){return new URLSearchParams(location.search).get('launch')||'';}
function initHeaders(){const data=window.Telegram?.WebApp?.initData||'';const h={'X-Telegram-Init-Data':data};const launch=launchToken();if(launch)h['X-ProblemNet-Launch-Token']=launch;return h;}
function noTelegram(){return !((window.Telegram?.WebApp?.initData)||launchToken());}
function waitForTelegram(){return new Promise(resolve=>{let n=0;const t=setInterval(()=>{const d=window.Telegram?.WebApp?.initData||'';if(d||launchToken()||n++>30){clearInterval(t);resolve(d||launchToken())}},100);});}

async function api(path,opt={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);let r;try{r=await fetch(path,{...opt,signal:controller.signal,headers:{...initHeaders(),...(opt.headers||{}),'Content-Type':'application/json'}});const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error(t||r.status)}if(!r.ok)throw Error(d.error||d.details||t);return d}catch(e){throw new Error(e.name==='AbortError'?'Сервер не ответил за 12 секунд.':'Сеть: '+e.message)}finally{clearTimeout(timer)}}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let DATA=null;
function nav(){return `<div class="nav"><button class="btn primary" onclick="overview()">📊 KPI</button><button class="btn" onclick="workload()">👥 Workload</button><button class="btn" onclick="sla()">⏱ SLA</button><button class="btn" onclick="ai()">🤖 AI</button><button class="btn" onclick="prompts()">🧠 Prompts</button><button class="btn" onclick="policies()">🛡 Policies</button><button class="btn" onclick="incidents()">🚨 Incidents</button><button class="btn" onclick="shadow()">👻 Shadow</button><button class="btn" onclick="lms()">🎓 LMS</button><button class="btn" onclick="staff()">👥 Staff</button><button class="btn" onclick="deploy()">🚀 Deploy</button></div><div id="section"></div>`}
function render(d){DATA=d;document.getElementById('me').textContent=`Founder ID: ${d.founder_id}`;document.getElementById('app').innerHTML=nav();overview()}
function bars(items,key){if(!items?.length)return '<div class="muted">Нет данных</div>';let max=Math.max(...items.map(x=>Number(x[key]||0)),1);return '<div style="display:flex;align-items:end;gap:4px;height:170px">'+items.map(x=>`<div title="${esc(x.day||x.hour||'')}" style="flex:1;height:${Math.max(4,Number(x[key]||0)/max*150)}px;background:#2d6df6;border-radius:5px"></div>`).join('')+'</div>'}
function overview(){const d=DATA.dashboard,s=d.stats||{};document.getElementById('section').innerHTML=`<div class="grid"><div class="card"><div class="muted">Пользователи</div><div class="metric">${s.users||0}</div></div><div class="card"><div class="muted">Истории</div><div class="metric">${s.stories||0}</div></div><div class="card"><div class="muted">AI queue</div><div class="metric">${s.ai_queue||0}</div></div><div class="card"><div class="muted">Модераторы</div><div class="metric">${d.active_moderators||0}</div></div></div><div class="card"><h3>Публикации</h3>${bars(d.publications,'count')}</div><div class="card"><h3>Пользователи</h3>${bars(d.users,'count')}</div>`}
async function workload(){try{const d=await api('/admin/api/ops/workload');document.getElementById('section').innerHTML=`<div class="card"><h3>👥 Moderator workload balancing</h3><table class="table"><tr><th>ID</th><th>Сотрудник</th><th>Активно</th><th>Лимит</th><th>Вес</th><th>Статус</th></tr>${(d.items||[]).map(x=>`<tr><td>${x.admin_id}</td><td>${esc(x.full_name||'')}</td><td>${x.active_tasks}</td><td>${x.max_tasks}</td><td>${x.weight}</td><td>${x.enabled?'🟢':'🔴'}</td></tr>`).join('')}</table></div>`}catch(e){err(e)}}
async function sla(){try{const d=await api('/admin/api/ops/sla');let s=d.summary||{};document.getElementById('section').innerHTML=`<div class="grid"><div class="card"><div class="muted">Open</div><div class="metric">${s.open_dialogs||0}</div></div><div class="card"><div class="muted">Waiting</div><div class="metric">${s.waiting||0}</div></div><div class="card"><div class="muted">SLA breaches</div><div class="metric bad">${s.breached||0}</div></div><div class="card"><div class="muted">Avg first response</div><div class="metric">${Math.round((s.avg_first_response_seconds||0)/60)}m</div></div></div><div class="card"><h3>⏱ SLA by priority</h3><table class="table"><tr><th>Priority</th><th>Open</th><th>Breached</th></tr>${(d.by_priority||[]).map(x=>`<tr><td>${esc(x.priority)}</td><td>${x.open}</td><td>${x.breached}</td></tr>`).join('')}</table></div>`}catch(e){err(e)}}
async function ai(){try{const d=await api('/admin/api/ai-control');document.getElementById('section').innerHTML=`<div class="card"><h3>🤖 AI Control Center</h3><table class="table"><tr><th>Model</th><th>Enabled</th><th>Priority</th><th>Health</th></tr>${(d.models||[]).map(x=>`<tr><td>${esc(x.model)}</td><td>${x.enabled?'🟢':'⚪'}</td><td>${x.priority}</td><td>${((d.health||[]).find(h=>h.model===x.model)||{}).status||'unknown'}</td></tr>`).join('')}</table></div>`}catch(e){err(e)}}
async function prompts(){try{const d=await api('/admin/api/ops/prompts');document.getElementById('section').innerHTML=`<div class="card"><h3>🧠 Prompt/version control</h3><div class="row"><input id="pn" placeholder="analysis / moderation / quality / post_generation"><button class="btn" onclick="newPrompt()">Новый prompt</button></div>${(d.items||[]).map(x=>`<div class="card"><b>${esc(x.name)} v${x.version}</b> ${x.active?'🟢 ACTIVE':''}<div class="muted">${esc(x.prompt_text).slice(0,500)}</div>${!x.active?`<button class="btn" onclick="activatePrompt(${x.id})">Активировать</button>`:''}</div>`).join('')}</div>`}catch(e){err(e)}}
async function newPrompt(){const name=document.getElementById('pn').value.trim();if(!name)return;const text=prompt('Текст нового prompt:');if(text===null)return;await api('/admin/api/ops/prompts',{method:'POST',body:JSON.stringify({name,prompt_text:text,activate:true})});prompts()}
async function activatePrompt(id){await api('/admin/api/ops/prompts/'+id+'/activate',{method:'POST',body:'{}'});prompts()}
async function policies(){try{const d=await api('/admin/api/ops/policies');document.getElementById('section').innerHTML=`<div class="card"><h3>🛡 Policy editor</h3>${(d.items||[]).map(x=>`<div class="card"><b>${esc(x.title)}</b><div class="muted">${esc(x.key)}</div><textarea id="pc-${x.key}">${esc(x.config_json||'{}')}</textarea><button class="btn" onclick="savePolicy('${x.key}','${esc(x.title)}')">Сохранить</button></div>`).join('')}</div>`}catch(e){err(e)}}
async function savePolicy(key,title){let cfg;try{cfg=JSON.parse(document.getElementById('pc-'+key).value)}catch{alert('JSON error');return}await api('/admin/api/ops/policies',{method:'PUT',body:JSON.stringify({key,title,config:cfg,enabled:true})});policies()}
async function incidents(){try{const d=await api('/admin/api/ops/incidents');document.getElementById('section').innerHTML=`<div class="card"><h3>🚨 Incident Center</h3><button class="btn primary" onclick="newIncident()">Создать incident</button>${(d.items||[]).map(x=>`<div class="card"><b>${esc(x.title)}</b><div>${esc(x.service)} • ${esc(x.severity)} • ${esc(x.status)}</div><div class="muted">${esc(x.details||'')}</div>${x.status==='open'?`<button class="btn" onclick="resolveIncident(${x.id})">Закрыть</button>`:''}</div>`).join('')}</div>`}catch(e){err(e)}}
async function newIncident(){const title=prompt('Название incident');if(!title)return;const severity=prompt('severity: low/medium/high/critical','high')||'high';await api('/admin/api/ops/incidents',{method:'POST',body:JSON.stringify({title,severity,service:'manual',details:'Founder created incident'})});incidents()}
async function resolveIncident(id){await api('/admin/api/ops/incidents/'+id+'/resolve',{method:'POST',body:JSON.stringify({note:'Resolved from Founder Center'})});incidents()}
async function shadow(){try{const d=await api('/admin/api/ops/shadow');document.getElementById('section').innerHTML=`<div class="card"><h3>👻 AI Shadow Mode</h3><div class="muted">Shadow results never affect the production answer.</div><table class="table"><tr><th>Story</th><th>Stage</th><th>Model</th><th>Latency</th><th>Error</th></tr>${(d.items||[]).map(x=>`<tr><td>${x.story_id||'—'}</td><td>${esc(x.stage)}</td><td>${esc(x.model)}</td><td>${x.latency_ms} ms</td><td>${esc(x.error||'')}</td></tr>`).join('')}</table></div>`}catch(e){err(e)}}
async function lms(){try{const d=await api('/admin/api/lms/full');document.getElementById('section').innerHTML=`<div class="card"><h3>🎓 LMS Control</h3><p class="muted">Обязательное обучение автоматически назначается всем сотрудникам кроме владельца. Сертификаты отсутствуют.</p><div>Курсов: ${(d.courses||[]).length} • Уроков: ${(d.lessons||[]).length} • Тестов: ${(d.tests||[]).length} • Назначений: ${(d.assignments||[]).length}</div><button class="btn primary" onclick="createCourse()">➕ Создать обязательный курс</button>${(d.courses||[]).map(c=>`<div class="card"><b>${esc(c.title)}</b><div class="muted">required=${c.required?'yes':'no'} • deadline=${c.deadline_days}d</div><button class="btn" onclick="assignCourse(${c.id})">📌 Назначить сотруднику</button></div>`).join('')}<h4>Прогресс сотрудников</h4>${(d.assignments||[]).slice(0,200).map(a=>`<div class="muted">${a.admin_id} — ${esc(a.course_title)} — ${esc(a.status)} — ${a.progress}%</div>`).join('')}</div>`}catch(e){err(e)}}
async function createCourse(){const title=prompt('Название обязательного курса');if(!title)return;const lesson=prompt('Текст первого урок');if(!lesson)return;const question=prompt('Вопрос теста');if(!question)return;const opts=(prompt('Варианты через |. Первый вариант будет правильным')||'').split('|').map(x=>x.trim()).filter(Boolean);if(opts.length<2)return;await api('/admin/api/lms/manage',{method:'POST',body:JSON.stringify({action:'create_course',title,required:true,deadline_days:7})});const full=await api('/admin/api/lms/full');const c=full.courses[full.courses.length-1];const lessons=full.lessons.filter(x=>x.course_id===c.id);await api('/admin/api/lms/manage',{method:'POST',body:JSON.stringify({action:'create_lesson',course_id:c.id,title:'Урок 1',content:lesson})});const full2=await api('/admin/api/lms/full');const l=full2.lessons.filter(x=>x.course_id===c.id)[0];await api('/admin/api/lms/manage',{method:'POST',body:JSON.stringify({action:'create_test',lesson_id:l.id,question,options:opts,correct_answer:opts[0]})});lms()}
async function assignCourse(courseId){const id=prompt('Telegram ID сотрудника');if(!id)return;await api('/admin/api/lms/assign',{method:'POST',body:JSON.stringify({admin_id:Number(id),course_id:courseId})});lms()}
async function staff(){try{const d=await api('/admin/api/employees');document.getElementById('section').innerHTML=`<div class="card"><h3>👥 Employees</h3>${(d.items||[]).map(x=>`<div class="card"><b>${esc(x.full_name||('ID '+x.admin_id))}</b><div>${x.admin_id} • ${esc(x.role||'')} • ${esc(x.status||'')}</div><button class="btn" onclick="staffRole(${x.admin_id})">Роль</button><button class="btn" onclick="staffStatus(${x.admin_id})">Статус</button><button class="btn" onclick="lmsEmployee(${x.admin_id})">🎓 LMS</button></div>`).join('')}<button class="btn primary" onclick="addStaff()">➕ Добавить сотрудника</button></div>`}catch(e){err(e)}}
async function addStaff(){const id=prompt('Telegram ID');if(!id)return;const name=prompt('Имя');if(!name)return;const role=prompt('Роль','moderator')||'moderator';await api('/admin/api/employee',{method:'POST',body:JSON.stringify({admin_id:Number(id),full_name:name,role})});staff()}
async function staffRole(id){const role=prompt('Роль: moderator/support/analyst/editor','moderator');if(!role)return;await api('/admin/api/employee/'+id+'/role',{method:'PUT',body:JSON.stringify({role})});staff()}
async function staffStatus(id){const status=prompt('Статус: trainee/employee/senior/leader/fired','employee');if(!status)return;await api('/admin/api/employee/'+id+'/status',{method:'PUT',body:JSON.stringify({status})});staff()}
async function lmsEmployee(id){const d=await api('/admin/api/lms/employee/'+id);document.getElementById('section').innerHTML=`<div class="card"><h3>🎓 LMS ${id}</h3>${(d.required||[]).map(x=>`<div>${esc(x.title)} — ${esc(x.status)} — ${x.progress}%</div>`).join('')}<button class="btn" onclick="staff()">Назад</button></div>`}
async function deploy(){try{const d=await api('/admin/api/deployments');document.getElementById('section').innerHTML=`<div class="card"><h3>🚀 Staging → Production</h3><table class="table"><tr><th>Env</th><th>Status</th><th>Commit</th><th>Time</th></tr>${(d.items||[]).map(x=>`<tr><td>${esc(x.environment)}</td><td>${esc(x.status)}</td><td>${esc((x.commit_sha||'').slice(0,10))}</td><td>${esc(x.created_at)}</td></tr>`).join('')}</table><p class="muted">Для реального автоматического rollback задайте RAILWAY_API_TOKEN и включите AUTO_ROLLBACK_ENABLED=1. Railway также поддерживает deploy-time healthchecks.</p></div>`}catch(e){err(e)}}
function err(e){document.getElementById('app').innerHTML=`<div class="card bad"><b>❌ Ошибка</b><div style="margin-top:8px">${esc(e?.message||e)}</div><button class="btn primary" style="margin-top:12px" onclick="load()">Повторить</button></div>`}
async function load(){
 try{
  await waitForTelegram();
  if(noTelegram()){err(new Error('Не удалось подтвердить запуск. Откройте Mini App кнопкой из Moderator Bot.')) ; return;}
  render(await api('/founder/api'));
 }catch(e){err(e)}
}
load();
</script></body></html>
