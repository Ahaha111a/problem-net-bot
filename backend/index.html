<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Панель сотрудников — Проблем нет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#000;color:#f5f7fa;font-family:Inter,system-ui,-apple-system,sans-serif}header{position:sticky;top:0;background:#080808ee;backdrop-filter:blur(14px);padding:16px;border-bottom:1px solid #202020;z-index:5}.title{font-size:21px;font-weight:800}.muted{color:#8d939b;font-size:13px}.wrap{padding:14px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.story{background:#0e0e10;border:1px solid #242428;border-radius:18px;padding:14px;box-shadow:0 8px 30px #0008}.metric{font-size:28px;font-weight:800}.btn{width:100%;border:0;border-radius:14px;padding:13px 14px;background:#1b1b20;color:#fff;font-weight:700;margin-top:9px}.btn.primary{background:#2b6cff}.btn.danger{background:#7f2630}.story{margin-top:12px}.story h3{margin:0 0 8px}.text{white-space:pre-wrap;line-height:1.45;color:#ddd}.row{display:flex;gap:8px}.row>*{flex:1}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#1d2634;color:#a9c8ff;font-size:12px}.hidden{display:none}.error{color:#ff7c88;margin-top:12px}.chart{height:180px;display:flex;align-items:end;gap:4px}.bar{flex:1;background:#2b6cff;border-radius:6px 6px 0 0;min-height:3px}.nav{display:flex;gap:8px;overflow:auto;padding:10px 0}.nav .btn{white-space:nowrap;width:auto;margin:0}.loader{padding:40px;text-align:center;color:#9da3ab}
</style></head>
<body>
<header><div class="title">🛡 Панель сотрудников</div><div id="me" class="muted">Загрузка…</div></header>
<div class="wrap"><div id="app" class="loader">Подключение к серверу…</div></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const initData=tg?.initData||'';
const headers={'X-Telegram-Init-Data':initData};
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...headers,...(opt.headers||{}), 'Content-Type':'application/json'}}); const text=await r.text(); let data; try{data=JSON.parse(text)}catch{throw new Error(text||('HTTP '+r.status))}; if(!r.ok) throw new Error(data.error||data.details||('HTTP '+r.status)); return data}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){try{const d=await api('/admin/api/dashboard'); document.getElementById('me').textContent=`ID ${d.me.id} • роль: ${d.me.role} • Europe/Moscow`; render(d)}catch(e){document.getElementById('app').innerHTML=`<div class="error">❌ ${esc(e.message)}</div><button class="btn" onclick="location.reload()">Повторить</button>`}}
function render(d){const s=d.stats||{}; document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="muted">Истории</div><div class="metric">${s.total??0}</div></div><div class="card"><div class="muted">Опубликовано</div><div class="metric">${s.published??0}</div></div><div class="card"><div class="muted">Модерация</div><div class="metric">${s.waiting??0}</div></div><div class="card"><div class="muted">Пользователи</div><div class="metric">${s.users??0}</div></div></div><div class="nav"><button class="btn primary" onclick="stories()">📥 Модерация</button><button class="btn" onclick="analytics()">📊 Аналитика</button><button class="btn" onclick="monitoring()">🖥 Мониторинг</button><button class="btn" onclick="training()">🎓 Обучение</button></div><div id="section"></div>`; stories()}
async function stories(){const box=document.getElementById('section');box.innerHTML='<div class="loader">Загрузка историй…</div>';try{const d=await api('/admin/api/stories');box.innerHTML=(d.stories||[]).map(x=>`<div class="story"><div class="row"><h3>История #${x.id}</h3><span class="status">${esc(x.status)}</span></div><div class="text">${esc(x.text)}</div><div class="row"><button class="btn primary" onclick="action(${x.id},'publish')">Опубликовать</button><button class="btn danger" onclick="action(${x.id},'reject')">Отклонить</button></div><button class="btn" onclick="openStory(${x.id})">Открыть</button></div>`).join('')||'<div class="card">🟢 Историй нет.</div>'}catch(e){box.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}
async function openStory(id){try{const d=await api('/admin/api/story/'+id); const x=d.story||d; document.getElementById('section').innerHTML=`<div class="story"><h3>История #${x.id}</h3><div class="text">${esc(x.text)}</div><hr><div class="text">${esc(x.post_text||'')}</div><button class="btn primary" onclick="action(${x.id},'publish')">Опубликовать</button><button class="btn danger" onclick="action(${x.id},'reject')">Отклонить</button><button class="btn" onclick="stories()">Назад</button></div>`}catch(e){alert(e.message)}}
async function action(id,act){try{await api(`/admin/api/story/${id}/${act}`,{method:'POST',body:JSON.stringify({})}); tg?.HapticFeedback?.notificationOccurred('success'); stories()}catch(e){alert(e.message)}}
async function analytics(){const box=document.getElementById('section');try{const d=await api('/admin/api/analytics');box.innerHTML=`<div class="card"><h3>📊 Аналитика</h3><pre class="text">${esc(JSON.stringify(d,null,2))}</pre></div>`}catch(e){box.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}
async function monitoring(){const box=document.getElementById('section');try{const d=await api('/admin/api/monitoring');box.innerHTML=`<div class="card"><h3>🖥 Системный мониторинг</h3><pre class="text">${esc(JSON.stringify(d,null,2))}</pre></div>`}catch(e){box.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}
async function training(){const box=document.getElementById('section');try{const d=await api('/admin/api/training');box.innerHTML=`<div class="card"><h3>🎓 Обучение сотрудников</h3><pre class="text">${esc(JSON.stringify(d,null,2))}</pre></div>`}catch(e){box.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}
load();
</script></body></html>
