<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Панель сотрудников — Проблем нет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#000;color:#f5f7fa;font-family:Inter,system-ui,-apple-system,sans-serif}header{position:sticky;top:0;background:#080808ee;backdrop-filter:blur(14px);padding:16px;border-bottom:1px solid #202020;z-index:5}.title{font-size:21px;font-weight:800}.muted{color:#8d939b;font-size:13px}.wrap{padding:14px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.story{background:#0e0e10;border:1px solid #242428;border-radius:18px;padding:14px;box-shadow:0 8px 30px #0008}.metric{font-size:28px;font-weight:800}.btn{width:100%;border:0;border-radius:14px;padding:13px 14px;background:#1b1b20;color:#fff;font-weight:700;margin-top:9px}.btn.primary{background:#2b6cff}.btn.danger{background:#7f2630}.story{margin-top:12px}.story h3{margin:0 0 8px}.text{white-space:pre-wrap;line-height:1.45;color:#ddd}.row{display:flex;gap:8px}.row>*{flex:1}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#1d2634;color:#a9c8ff;font-size:12px}.hidden{display:none}.error{color:#ff7c88;margin-top:12px}.chart{height:180px;display:flex;align-items:end;gap:4px}.bar{flex:1;background:#2b6cff;border-radius:6px 6px 0 0;min-height:3px}.nav{display:flex;gap:8px;overflow:auto;padding:10px 0}.nav .btn{white-space:nowrap;width:auto;margin:0}.loader{padding:40px;text-align:center;color:#9da3ab}
</style></head>
<body>
<header><div class="title">🛡 Панель сотрудников</div><div id="me" class="muted">Загрузка…</div></header>
<div class="wrap"><div id="app" class="loader">Подключение к серверу…</div></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const initData=tg?.initData||'';
const headers={'X-Telegram-Init-Data':initData};
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...headers,...(opt.headers||{}), 'Content-Type':'application/json'}}); const text=await r.text(); let data; try{data=JSON.parse(text)}catch{throw new Error(text||('HTTP '+r.status))}; if(!r.ok) throw new Error(data.error||data.details||text||('HTTP '+r.status)); return data}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function safety(){const box=document.getElementById('section');try{const d=await api('/admin/api/monitoring');const ev=(d.errors||[]).filter(x=>String(x.service||'').includes('ai'));box.innerHTML=`<div class="card"><h3>🛡 AI Safety Pipeline</h3><div class="muted">Ошибки AI и safety telemetry</div>${ev.map(x=>`<div class="story"><b>${esc(x.service)}</b><div>${esc(x.message)}</div><div class="muted">${esc(x.created_at)}</div></div>`).join('')||'<div class="muted">AI safety ошибок нет.</div>'}</div>`}catch(e){box.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}
function founder(){window.location.href='/founder'}
async function load(){try{const d=await api('/admin/api/dashboard'); document.getElementById('me').textContent=`ID ${d.me.id} • роль: ${d.me.role} • Europe/Moscow`; render(d)}catch(e){document.getElementById('app').innerHTML=`<div class="error">❌ ${esc(e.message)}</div><button class="btn" onclick="location.reload()">Повторить</button>`}}
function render(d){const s=d.stats||{}; document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="muted">Истории</div><div class="metric">${s.total??0}</div></div><div class="card"><div class="muted">Опубликовано</div><div class="metric">${s.published??0}</div></div><div class="card"><div class="muted">Модерация</div><div class="metric">${s.waiting??0}</div></div><div class="card"><div class="muted">Пользователи</div><div class="metric">${s.users??0}</div></div></div><div class="nav"><button class="btn primary" onclick="stories()">📥 Модерация</button><button class="btn" onclick="analytics()">📊 Аналитика</button><button class="btn" onclick="monitoring()">🖥 Мониторинг</button><button class="btn" onclick="employees()">👥 Сотрудники</button><button class="btn" onclick="leaderboard()">🏆 KPI</button><button class="btn" onclick="training()">🎓 Обучение</button><button class="btn" onclick="safety()">🛡 AI Safety</button><button class="btn" onclick="founder()">👑 Founder</button></div><div id="section"></div>`; stories()}
async function stories(){const box=document.getElementById('section');box.innerHTML='<div class="loader">Загрузка историй…</div>';try{const d=await api('/admin/api/stories');box.innerHTML=(d.items||[]).map(x=>`<div class="story"><div class="row"><h3>История #${x.id}</h3><span class="status">${esc(x.status)}</span></div><div class="text">${esc(x.text)}</div><div class="row"><button class="btn primary" onclick="action(${x.id},'publish')">Опубликовать</button><button class="btn danger" onclick="action(${x.id},'reject')">Отклонить</button></div><div class="row"><button class="btn" onclick="openStory(${x.id})">Открыть</button><button class="btn" onclick="runAI(${x.id})">🤖 ИИ</button></div></div>`).join('')||'<div class="card">🟢 Историй нет.</div>'}catch(e){box.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}
async function openStory(id){
 try{
  const d=await api('/admin/api/story/'+id);
  const x=d.story||d;
  document.getElementById('section').innerHTML=`
   <div class="story">
    <h3>История #${x.id}</h3>
    <div class="muted">Статус: ${esc(x.status||'')}</div>
    <label class="muted">Исходный текст</label>
    <textarea id="storyText" style="width:100%;min-height:140px;background:#090909;color:#fff;border:1px solid #333;border-radius:12px;padding:10px;margin-top:6px">${esc(x.text||'')}</textarea>
    <label class="muted">Готовый пост</label>
    <textarea id="postText" style="width:100%;min-height:180px;background:#090909;color:#fff;border:1px solid #333;border-radius:12px;padding:10px;margin-top:6px">${esc(x.post_text||'')}</textarea>
    <button class="btn primary" onclick="saveStory(${x.id})">💾 Сохранить</button>
    <button class="btn" onclick="runAI(${x.id})">🤖 Повторить ИИ-анализ</button>
    <button class="btn primary" onclick="action(${x.id},'publish')">✅ Опубликовать</button>
    <button class="btn danger" onclick="action(${x.id},'reject')">❌ Отклонить</button>
    <button class="btn" onclick="stories()">⬅️ Назад</button>
   </div>`;
 }catch(e){document.getElementById('section').innerHTML=`<div class="error">❌ ${esc(e.message)}</div><button class="btn" onclick="stories()">Назад</button>`}
}
async function saveStory(id){
 try{
  const text=document.getElementById('storyText').value;
  const post_text=document.getElementById('postText').value;
  await api('/admin/api/story/'+id,{method:'PUT',body:JSON.stringify({text,post_text})});
  tg?.HapticFeedback?.notificationOccurred('success');
  await openStory(id);
 }catch(e){alert(e.message)}
}
async function action(id,act){try{await api(`/admin/api/story/${id}/${act}`,{method:'POST',body:JSON.stringify({})}); tg?.HapticFeedback?.notificationOccurred('success'); stories()}catch(e){alert(e.message)}}
async function runAI(id){try{document.getElementById('section').innerHTML='<div class="loader">🤖 ИИ обрабатывает историю…</div>';await api(`/admin/api/story/${id}/ai`,{method:'POST',body:JSON.stringify({})});tg?.HapticFeedback?.notificationOccurred('success');await openStory(id)}catch(e){document.getElementById('section').innerHTML=`<div class="error">❌ ${esc(e.message)}</div><button class="btn" onclick="openStory(${id})">Назад</button>`}}
async function publishFromStory(id){return action(id,'publish')}
async function rejectFromStory(id){return action(id,'reject')}
async function analytics(){const box=document.getElementById('section');try{const d=await api('/admin/api/analytics');box.innerHTML=`<div class="card"><h3>📊 Аналитика</h3><pre class="text">${esc(JSON.stringify(d,null,2))}</pre></div>`}catch(e){box.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}
async function monitoring(){const box=document.getElementById('section');try{const d=await api('/admin/api/monitoring');box.innerHTML=`<div class="card"><h3>🖥 Системный мониторинг</h3><pre class="text">${esc(JSON.stringify(d,null,2))}</pre></div>`}catch(e){box.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}
async function training(){const box=document.getElementById('section');try{const d=await api('/admin/api/training');box.innerHTML=`<div class="card"><h3>🎓 Обучение сотрудников</h3><pre class="text">${esc(JSON.stringify(d,null,2))}</pre></div>`}catch(e){box.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}

async function employees(){const box=document.getElementById('section');try{const d=await api('/admin/api/employees');box.innerHTML='<div class="card"><h3>👥 Сотрудники</h3>'+(d.items||[]).map(x=>`<div class="story"><b>${esc(x.full_name||('ID '+x.admin_id))}</b><div class="muted">${esc(x.position||'')} • ${esc(x.status||'')} • роль: ${esc(x.role||'')}</div><button class="btn" onclick="employee(${x.admin_id})">Профиль</button></div>`).join('')+'</div>'}catch(e){box.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}
async function employee(id){const box=document.getElementById('section');try{const d=await api('/admin/api/employee/'+id),x=d.employee||{};box.innerHTML=`<div class="card"><h3>👤 ${esc(x.full_name||('ID '+id))}</h3><div class="muted">${esc(x.position||'')} • ${esc(x.status||'')} • ${esc(x.role||'')}</div><h4>Разрешения</h4>${(d.permissions||[]).map(p=>`<div>${esc(p.permission)} — ${p.enabled?'✅':'❌'}</div>`).join('')}<h4>Роли</h4>${(d.role_history||[]).map(r=>`<div class="muted">${esc(r.old_role||'-')} → ${esc(r.new_role)} • ${esc(r.created_at)}</div>`).join('')}<h4>Повышения</h4>${(d.promotion_history||[]).map(r=>`<div class="muted">${esc(r.old_status||'-')} → ${esc(r.new_status)} • ${esc(r.created_at)}</div>`).join('')}<h4>Нарушения</h4>${(d.violations||[]).map(r=>`<div class="muted">${esc(r.severity)}: ${esc(r.reason)}</div>`).join('')}<button class="btn" onclick="employees()">Назад</button></div>`}catch(e){box.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}
async function leaderboard(){const box=document.getElementById('section');try{const d=await api('/admin/api/leaderboard?days=30');box.innerHTML='<div class="card"><h3>🏆 KPI</h3>'+(d.items||[]).map(x=>`<div class="story"><b>ID ${x.admin_id}</b><div class="metric">${x.score}</div><div class="muted">Модераций: ${x.moderated||0} • публикаций: ${x.published||0} • ошибок: ${x.errors||0}</div></div>`).join('')+'</div>'}catch(e){box.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`}}

load();
</script></body></html>
