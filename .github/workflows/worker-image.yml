name: Build AI Worker image

on:
  push:
    branches: ["main"]
    paths:
      - "backend/ai.py"
      - "backend/ai_queue.py"
      - "backend/ai_worker.py"
      - "backend/database.py"
      - "backend/config.py"
      - "requirements.txt"
      - "Dockerfile.worker"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/ahaha111a/problem-net-bot-ai-worker:latest
